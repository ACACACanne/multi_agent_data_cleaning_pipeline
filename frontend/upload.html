<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Upload test</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body {
        font-family: system-ui, Arial, sans-serif;
        padding: 24px;
        background: #0b1220;
        color: #f3f4f6;
      }
      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      button {
        padding: 8px 16px;
        border-radius: 6px;
        border: none;
        background: #60a5fa;
        color: #0b1220;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      #result {
        white-space: pre-wrap;
        margin-top: 16px;
        background: #0f1724;
        border: 1px solid rgba(96, 165, 250, 0.25);
        padding: 12px;
        border-radius: 6px;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>Upload test</h1>

    <div class="controls">
      <input id="fileInput" type="file" accept=".csv,.json" />
      <button id="uploadBtn" type="button">Upload</button>
    </div>

    <div id="result"></div>

    <script>
      const uploadBtn = document.getElementById("uploadBtn");
      const fileInput = document.getElementById("fileInput");
      const result = document.getElementById("result");

      function getApiBaseUrl() {
        const host = window.location.hostname;
        if (host === "localhost" || host === "127.0.0.1" || !host) {
          return "http://127.0.0.1:8000";
        }
        return "https://multi-agent-data-cleaning-pipeline.onrender.com";
      }

      uploadBtn.addEventListener("click", async () => {
        if (!fileInput.files || !fileInput.files.length) {
          result.textContent = "Please choose a CSV or JSON file first.";
          return;
        }

        const fd = new FormData();
        fd.append("file", fileInput.files[0]);

        const headers = {};
        const token =
          localStorage.getItem("token") ||
          localStorage.getItem("datara_auth_token");
        if (token) {
          headers["Authorization"] = `Bearer ${token}`;
        }

        const uploadUrl = `${getApiBaseUrl()}/api/upload`;
        uploadBtn.disabled = true;
        result.textContent = `Uploading to ${uploadUrl}...`;

        try {
          const res = await fetch(uploadUrl, {
            method: "POST",
            body: fd,
            headers,
          });

          const text = await res.text();
          result.textContent = `Status: ${res.status}\n\n${text}`;
        } catch (err) {
          result.textContent = "Upload failed: " + err;
        } finally {
          uploadBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
