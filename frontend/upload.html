<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Upload test</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body {
        font-family: system-ui, Arial, sans-serif;
        padding: 24px;
      }
      #result {
        white-space: pre-wrap;
        margin-top: 12px;
        background: #f6f8fa;
        padding: 10px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <h1>Upload test</h1>

    <input id="fileInput" type="file" />
    <button id="uploadBtn">Upload</button>

    <div id="result"></div>

    <script>
      const uploadBtn = document.getElementById("uploadBtn");
      const fileInput = document.getElementById("fileInput");
      const result = document.getElementById("result");

      uploadBtn.addEventListener("click", async () => {
        if (!fileInput.files.length) {
          result.textContent = "Please choose a file first.";
          return;
        }

        const fd = new FormData();
        fd.append("file", fileInput.files[0]); // <-- field name must be "file"

        try {
          const res = await fetch("http://127.0.0.1:8000/api/upload", {
            method: "POST",
            body: fd,
            headers: {
              // Add the API key header for authentication (replace with actual key)
              "X-API-Key":
                "EFR2VNyt2WM6KFW0Vsy-2nFf-9dJ6JDTuVwXqSv--4voUhj0MPnmvR3JgvPARKLO",
              // If you prefer JWT auth, remove the X-API-Key line and add:
              // 'Authorization': 'Bearer YOUR_JWT'
            },
          });

          const text = await res.text();
          result.textContent = `Status: ${res.status}\n\n${text}`;
        } catch (err) {
          result.textContent = "Upload failed: " + err;
        }
      });
    </script>
  </body>
</html>
