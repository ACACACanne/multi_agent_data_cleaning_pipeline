services:
  - type: web
    name: multi-agent-data-cleaning-pipeline
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r backend/requirements.txt
    startCommand: uvicorn src.app:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./data.db
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://multi-agent-data-cleaning-pipeline.vercel.app,http://localhost:5173
